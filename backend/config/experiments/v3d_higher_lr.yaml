# v3d: Higher LR, more aggression. Hypothesis: explore more, converge faster.
model:
  dropout: 0.5
  fine_tune_at: 130
training:
  learning_rate: 0.00001            # 1e-5 vs 5e-6 baseline
  epochs: 70
  class_weight: "balanced"
augmentation:
  rotation_range: 45.0
  zoom_range: 0.3
  brightness_range: [0.5, 1.5]
  contrast_range: [0.5, 1.5]
