# v3c: Explicit WASPADA weight boost. Hypothesis: penalize WASPADA false negatives more.
model:
  dropout: 0.5
  fine_tune_at: 130
training:
  learning_rate: 0.000005
  epochs: 70
  class_weight:                     # WASPADA 3x weight → prioritize correct WASPADA
    AMAN: 1.0
    WASPADA: 3.0
    BAHAYA: 1.0
augmentation:
  rotation_range: 45.0
  zoom_range: 0.3
  brightness_range: [0.5, 1.5]
  contrast_range: [0.5, 1.5]
