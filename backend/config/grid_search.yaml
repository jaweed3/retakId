# =============================================================================
# Retak.id — Grid Search Definition
# =============================================================================
# Usage:
#   make grid-gen    → generate experiment configs from this grid
#   make grid-run    → run all experiments (--resume to skip completed)
#   make tune        → grid-gen + grid-run
#
# ~24 experiments × ~15 min = ~6 jam CPU / ~1 jam GPU
# Each experiment auto-logged to MLflow for comparison.
# =============================================================================

parameters:

  # --- Model capacity ---
  model.dropout:
    - 0.4
    - 0.5

  model.fine_tune_at:
    - 120        # 34 layers — more capacity
    - 130        # 24 layers — baseline
    - 145        # 9 layers — minimal, low overfit risk

  # --- Learning dynamics ---
  training.learning_rate:
    - 0.00001    # 1e-5 (faster)
    - 0.000005   # 5e-6 (baseline)

  # --- Augmentation strength ---
  augmentation.rotation_range:
    - 30.0       # moderate
    - 45.0       # aggressive

  # --- Class weighting ---
  training.class_weight:
    - "balanced"  # auto-compute weights
    - null        # no weighting — test on balanced-ish data

# --- Fixed (same for all runs) ---
fixed:
  training.epochs: 70
  training.early_stopping_patience: 20
  training.reduce_lr_patience: 10
  augmentation.zoom_range: 0.3
  augmentation.brightness_range: [0.5, 1.5]
  augmentation.contrast_range: [0.5, 1.5]
  augmentation.translation_range: 0.25
  augmentation.fill_mode: "nearest"

# --- Rule out bad combos ---
exclude:
  # high LR + few layers = unstable
  - model.fine_tune_at: 145
    training.learning_rate: 0.00001
  # high dropout + many layers = too much regularization
  - model.dropout: 0.5
    model.fine_tune_at: 120

# Combinations: 2×3×2×2×2 = 48 - exclusions ≈ 24
