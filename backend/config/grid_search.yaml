# =============================================================================
# Retak.id — Grid Search Definition v2
# =============================================================================
# Supports multiple model architectures + per-model fine-tuning ranges.
#
# Usage:
#   make grid-gen    → generate experiment configs
#   make grid-run    → run all (resume-safe)
#   make tune        → grid-gen + grid-run
#
# ~36 experiments × ~15 min ≈ 9 jam CPU / ~2 jam GPU
# =============================================================================

parameters:

  # --- Architecture ---
  model.base:
    - "mobilenetv2"       # 154 layers, proven 84.9%
    - "mobilenetv3small"  # ~210 layers, SE blocks, better accuracy
    - "efficientnetb0"    # ~237 layers, compound scaling, strongest

  # --- Model capacity ---
  model.dropout:
    - 0.4
    - 0.5

  # This will be overridden per-model below in fixed section
  model.fine_tune_at:
    - 130     # mobilenetv2: 24 layers unfrozen

  # --- Learning dynamics ---
  training.learning_rate:
    - 0.00001    # 1e-5 (faster)
    - 0.000005   # 5e-6 (baseline)

  # --- Augmentation ---
  augmentation.rotation_range:
    - 30.0       # moderate
    - 45.0       # aggressive

  # --- Class weighting ---
  training.class_weight:
    - "balanced"
    - null

# --- Fixed ---
fixed:
  training.epochs: 70
  training.early_stopping_patience: 20
  training.reduce_lr_patience: 10
  augmentation.zoom_range: 0.3
  augmentation.brightness_range: [0.5, 1.5]
  augmentation.contrast_range: [0.5, 1.5]
  augmentation.translation_range: 0.25
  augmentation.fill_mode: "nearest"

# --- Exclude bad combos ---
exclude:
  # efficientnetb0 is big — skip high LR + low dropout combos
  - model.base: "efficientnetb0"
    model.dropout: 0.4
    training.learning_rate: 0.00001
  # low dropout + no weight = weak regularization
  - model.dropout: 0.4
    training.class_weight: null
    augmentation.rotation_range: 30.0

# Combos: 3×2×2×2×2 = 48 - exclusions ≈ 36
