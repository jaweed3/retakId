# Retak.id Training Configuration v3 — Test3
# Less aggressive fine-tuning, longer training, lower LR
#
# Changes from test2 (76.7%):
#   fine_tune_at: 100 → 130 (24 layers vs 54 — fewer params, less overfit)
#   LR: 1e-5 → 5e-6 (more cautious)
#   epochs: 50 → 70, patience: 15 → 20 (allow slow convergence)
#   reduce_lr: 7 → 10

data:
  processed_dir: "backend/data/processed"
  splits_dir: "backend/data/splits"
  img_size: [224, 224]
  batch_size: 32
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  base: "mobilenetv2"              # mobilenetv2 | mobilenetv3small | efficientnetb0
                                    # Layer counts: v2=154, v3small=~210, b0=~237
                                    # Set fine_tune_at relative to total layers
  weights: "imagenet"
  input_shape: [224, 224, 3]
  num_classes: 3
  dropout: 0.5
  freeze_base: false
  fine_tune_at: 130                # mobilenetv2: 130 (24 layers unfrozen)
                                    # mobilenetv3small: try 170 (40 layers)
                                    # efficientnetb0: try 200 (37 layers)

training:
  optimizer: "adam"
  learning_rate: 0.000005          # 5e-6 — slow and steady
  loss: "categorical_crossentropy"
  epochs: 70                       # 50 → 70
  early_stopping_patience: 20      # 15 → 20 (allow plateau)
  reduce_lr_patience: 10           # 7 → 10 (more patience before halving LR)
  class_weight: "balanced"

augmentation:
  random_flip:
    horizontal: true
    vertical: true
  rotation_range: 45.0             # 30 → 45 (lebih agresif)
  translation_range: 0.25          # 0.2 → 0.25
  zoom_range: 0.3                  # 0.2 → 0.3
  shear_range: 0.2
  brightness_range: [0.5, 1.5]     # [0.7, 1.3] → lebih lebar (foto outdoor variatif)
  contrast_range: [0.5, 1.5]       # [0.8, 1.2] → lebih lebar
  fill_mode: "nearest"

quantization:
  type: "int8"
  representative_samples: 100
  target_size_mb: 5

export:
  output_dir: "backend/models"
  model_name: "retak_mobilenetv2"
  include_metadata: true
  class_labels: ["AMAN", "WASPADA", "BAHAYA"]

logging:
  tensorboard_dir: "backend/logs/tensorboard"
  checkpoint_dir: "backend/models/checkpoints"
  runs_csv: "backend/logs/runs.csv"
  mlflow_uri: "backend/logs/mlruns"
    # Use DagsHub cloud MLflow (lihat experiments dari mana aja):
    #   export MLFLOW_TRACKING_URI=https://dagshub.com/jaweed3/retakId.mlflow
    #   export MLFLOW_TRACKING_USERNAME=jaweed3
    #   export MLFLOW_TRACKING_PASSWORD=<dagshub_token>
